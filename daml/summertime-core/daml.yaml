# SDK version is pinned from the latest dpm release on 16 Nov 2026.
# Re-check against the versions DevNet runs (Version Compatibility Dashboard)
# before the first DevNet deployment; see specification section 9.
sdk-version: 3.7.1
name: summertime-core
source: daml
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
# Token-standard interfaces only, never a token implementation (spec section 12).
data-dependencies:
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-request-v1-1.0.0.dar
  - ../dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
build-options:
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
