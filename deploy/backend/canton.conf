// Summertime's hosted ledger: one sequencer, one mediator and one participant in a single
// process, each storing its state in its own Postgres database, so the ledger (parties,
// users, contracts) survives restarts and redeploys. start.sh fills the CANTON_DB_* values
// from DATABASE_URL and creates the three databases if they are missing.

_storage {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties = {
      serverName = ${CANTON_DB_HOST}
      portNumber = ${CANTON_DB_PORT}
      user = ${CANTON_DB_USER}
      password = ${CANTON_DB_PASSWORD}
    }
  }
  parameters.max-connections = 8
}

canton {
  parameters.non-standard-config = yes

  sequencers.sequencer1 {
    public-api.port = 5001
    admin-api.port = 5002
    storage = ${_storage} { config.properties.databaseName = "canton_sequencer" }
    // The reference sequencer's ordering layer keeps its blocks in memory unless it is given
    // storage of its own; without this, a restarted sequencer waits for blocks that are gone.
    sequencer {
      type = reference
      config.storage = ${_storage} { config.properties.databaseName = "canton_sequencer_driver" }
    }
  }

  mediators.mediator1 {
    admin-api.port = 5202
    storage = ${_storage} { config.properties.databaseName = "canton_mediator" }
  }

  participants.participant1 {
    ledger-api.port = 6865
    admin-api.port = 6866
    http-ledger-api.port = 7575
    storage = ${_storage} { config.properties.databaseName = "canton_participant" }
  }
}
