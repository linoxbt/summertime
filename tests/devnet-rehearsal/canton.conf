// A one-participant network that, like a DevNet node, requires a bearer token on every
// Ledger API call (HMAC-signed JWTs from mock-oauth.mjs). Ports differ from scripts/dev.sh.
canton {
  parameters.non-standard-config = yes
  sequencers.sequencer1 {
    public-api.port = 5301
    admin-api.port = 5302
    storage.type = memory
  }
  mediators.mediator1 {
    admin-api.port = 5402
    storage.type = memory
  }
  participants.participant1 {
    storage.type = memory
    admin-api.port = 5512
    ledger-api {
      port = 5511
      auth-services = [{
        type = unsafe-jwt-hmac-256
        secret = "summertime-rehearsal-secret"
      }]
    }
    http-ledger-api.port = 7675
  }
}
