// Three participants on one synchronizer, all in memory, for the privacy tests of spec 26.2.
//   summertime: operator, forwarder and the token registry (pilot hosting)
//   importer-a, importer-b: one importer each
canton {
  parameters.non-standard-config = yes
  sequencers.sequencer1 {
    public-api.port = 5101
    admin-api.port = 5102
    storage.type = memory
  }
  mediators.mediator1 {
    admin-api.port = 5202
    storage.type = memory
  }
  participants {
    summertime {
      storage.type = memory
      admin-api.port = 5012
      ledger-api.port = 5011
      http-ledger-api.port = 5013
    }
    importer-a {
      storage.type = memory
      admin-api.port = 5022
      ledger-api.port = 5021
      http-ledger-api.port = 5023
    }
    importer-b {
      storage.type = memory
      admin-api.port = 5032
      ledger-api.port = 5031
      http-ledger-api.port = 5033
    }
  }
}
